<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>William Darlington</title>

  <link rel="icon" href="/favicon/user.png" sizes="32x32" />
  <link rel="shortcut icon" href="/favicon/user.png" />
  <meta name="theme-color" content="#0b0e14" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- AOS (used only on HOME) -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <style>
    :root{
      --bg:#0b0e14; --muted:#94a3b8; --text:#e8eefc;
      --brand:#7c3aed; --brand-2:#22d3ee; --ring:rgba(124,58,237,.4);
      --shadow:0 14px 40px rgba(0,0,0,.5); --radius:20px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:var(--text); line-height:1.55;
      background:
        radial-gradient(1200px 500px at 120% -10%, rgba(34,211,238,.08), transparent 60%),
        radial-gradient(1000px 500px at -20% 10%, rgba(124,58,237,.09), transparent 60%),
        var(--bg);
    }
    img,video{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    .container{width:min(1200px,92%);margin-inline:auto}

    /* Only hide elements that have data-aos when AOS is disabled */
    body:not(.aos-ready) [data-aos]{opacity:0}

    header{
      position:sticky; top:0; z-index:9999;
      background:rgba(15,21,36,.78);
      backdrop-filter:saturate(150%) blur(12px);
      border-bottom:1px solid rgba(255,255,255,.08);
      cursor:pointer; isolation:isolate;
    }

    .nav{display:flex;justify-content:flex-end;align-items:center;padding:14px 28px;gap:12px}
    .nav-links{display:flex;gap:12px;flex-wrap:wrap}
    .chip{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
    .pill{padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-2));font-weight:700;color:#0a0a0a;box-shadow:0 8px 24px var(--ring)}

    @media (max-width:560px){
      .nav{justify-content:center;padding:10px 14px}
      .nav-links{gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
      .nav-links::-webkit-scrollbar{display:none}
      .chip,.pill{padding:8px 12px;font-size:14px}
    }

    section{padding:24px 0 52px}
    .hero{display:grid;grid-template-columns:1fr 1fr;padding:64px 0;gap:32px;align-items:center}
    @media(max-width:900px){.hero{grid-template-columns:1fr;text-align:center}}
    .hero h1{font-size:clamp(32px,5vw,56px);font-weight:800;line-height:1.1;margin-bottom:10px}
    .hero p{color:var(--muted)}
    .hero-card{border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;justify-self:end;max-width:min(520px,90vw)}
    @media(max-width:900px){.hero-card{justify-self:center}}
    .hero-card img{width:100%;height:auto;object-fit:cover}

    .hidden{display:none}

    /* HOME grid — force consistent tiles, no gaps */
    #streamGrid{
      display:grid; gap:18px;
      grid-template-columns: repeat(4, 1fr);
    }
    @media (max-width:1100px){ #streamGrid{ grid-template-columns: repeat(3, 1fr); } }
    @media (max-width:800px){ #streamGrid{ grid-template-columns: repeat(2, 1fr); } }
    @media (max-width:520px){ #streamGrid{ grid-template-columns: 1fr; } }

    #streamGrid .shot{
      border-radius:var(--radius); overflow:hidden; background:#111;
      box-shadow:var(--shadow); cursor:pointer; aspect-ratio:16/9;
    }
    #streamGrid .shot img{width:100%;height:100%;object-fit:cover;background:#000; display:block}

    /* Travel cards keep hover */
    .travel-grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
    .place{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:16/9;background:#000}
    .place img{width:100%;height:100%;object-fit:cover;display:block;background:#000}
    .place .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,.08) 60%);display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
    .place h4{margin:0 0 6px;font-size:18px}
    .place p{margin:0 0 10px;font-size:14px;color:var(--muted)}
    .place a{align-self:start}

    footer{padding:28px 0;border-top:1px solid rgba(255,255,255,.08)}
    .footer-center{display:flex;flex-direction:column;align-items:center;gap:10px}
    .social{display:flex;gap:10px}

    /* Hover effects (home + travel) */
    @media (hover:hover) and (pointer:fine){
      #streamGrid .shot, .place{transition: transform .18s ease, box-shadow .18s ease;will-change: transform;}
      #streamGrid .shot:hover, .place:hover{transform: translateY(-4px) scale(1.02);box-shadow: 0 20px 50px rgba(0,0,0,.6);}
      #streamGrid .shot:focus-visible{outline: 2px solid var(--brand);outline-offset: 2px;}
    }

    /* Lightbox */
    .lightbox{position: fixed; inset: 0; z-index: 100;display: none; align-items: center; justify-content: center;background: rgba(0,0,0,.82); padding: 20px;}
    .lightbox.open{ display: flex; }
    .lightbox img{max-width: min(1200px, 95vw);max-height: 90vh;border-radius: 16px;box-shadow: var(--shadow);background:#000;}
    .lightbox .close{position: absolute; top: 14px; right: 14px;padding: 8px 12px; border-radius: 999px;background: rgba(255,255,255,.12);border: 1px solid rgba(255,255,255,.18);color: #fff; cursor: pointer;}
  </style>
</head>
<body>
<header onclick="if(!event.target.closest('a')) location.hash='#/';">
  <div class="nav container">
    <nav class="nav-links">
      <a class="chip" href="#/portfolio">Portfolio</a>
      <a class="chip" href="#/travels">Travel</a>
      <a class="pill" href="https://hdbot.io" target="_blank" rel="noopener">ALGOs</a>
      <a class="chip" href="mailto:hanley.darlington@gmail.com">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section id="view-home">
    <div class="container">
      <div class="hero">
        <div><h1>William Darlington</h1><p>Vires in Numeris</p><p>All Visuals are Authentic</p></div>
        <div class="hero-card">
          <img id="heroImg" src="/profile/profile-star.webp" alt="Profile" width="520" height="520" fetchpriority="high" loading="eager" decoding="async">
        </div>
      </div>

      <!-- HOME GRID -->
      <div id="streamGrid"></div>
      <!-- turns AOS on/off -->
      <div id="home-bottom-sentinel" style="height:1px"></div>
    </div>
  </section>

  <section id="view-portfolio" class="hidden">
    <div class="container">
      <div class="view-head"><h2>Portfolio</h2><a class="back" href="#/">← Home</a></div>
      <div class="gallery" id="portfolioGrid"><p style="color:#9aa7bd">Loading…</p></div>
    </div>
  </section>

  <section id="view-travels" class="hidden">
    <div class="container">
      <div class="view-head"><h2>Travel</h2><a class="back" href="#/">← Home</a></div>
      <div class="travel-grid" id="travelCards"><p style="color:#9aa7bd">Loading…</p></div>
    </div>
  </section>

  <section id="view-album" class="hidden">
    <div class="container">
      <div class="view-head"><h2 id="albumTitle">Album</h2><a class="back" href="#/travels">← All trips</a></div>
      <div class="gallery" id="albumGrid"><p style="color:#9aa7bd">Loading…</p></div>
    </div>
  </section>
</main>

<footer>
  <div class="container footer-center">
    <div class="social">
      <a class="chip" href="https://www.linkedin.com/in/william-darlington-736475212/" target="_blank" rel="noopener">LinkedIn</a>
      <a class="chip" href="https://instagram.com/wi11.4m" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
</footer>

<div id="lightbox" class="lightbox" aria-modal="true" role="dialog">
  <button class="close" aria-label="Close">✕</button>
</div>

<!-- AOS for home -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script>
(()=>{
  const $ = (id)=>document.getElementById(id);
  const isMobile = ()=> window.matchMedia('(max-width:700px)').matches;

  /* ---------------- HOME: fixed 12 images from /homepage/ ---------------- */
  function homeAnim(i){
    const n=i+1;
    if(n===1) return 'zoom-in-right';
    if(n===2||n===3) return 'zoom-in-down';
    if(n===4) return 'zoom-in-left';
    if(n===5) return 'zoom-in-right';
    if(n===6||n===7) return 'zoom-in';
    if(n===8) return 'zoom-in-left';
    if(n===9) return 'zoom-in-right';
    if(n===10||n===11) return 'zoom-in-up';
    if(n===12) return 'zoom-in-left';
    return 'zoom-in';
  }

  function mountHomepageGrid(){
    const el=$('streamGrid'); el.innerHTML='';
    for(let i=1;i<=12;i++){
      const fig=document.createElement('figure'); fig.className='shot';
      // desktop only animations
      if(!isMobile()) fig.setAttribute('data-aos', homeAnim(i-1));
      const img=new Image();
      img.src='/homepage/'+i+'.webp';
      img.alt='Homepage '+i;
      img.loading='lazy';
      fig.appendChild(img);
      el.appendChild(fig);
    }
    if(window.AOS && AOS.refresh) AOS.refresh();
  }

  /* ---------------- AOS toggle at bottom of HOME ---------------- */
  let aosInit=false;
  function ensureAOS(){
    if(aosInit) return;
    aosInit=true;
    if(window.AOS) AOS.init({ once:true, duration:500, easing:'ease-out' });
  }
  function initAOSToggle(){
    const sentinel=$('home-bottom-sentinel');
    if(!('IntersectionObserver' in window) || !sentinel) return;
    const io=new IntersectionObserver((entries)=>{
      for(const e of entries){
        if(e.isIntersecting){
          ensureAOS();
          document.body.classList.add('aos-ready');   // show & animate
          if(window.AOS && AOS.refresh) AOS.refresh();
        }else{
          document.body.classList.remove('aos-ready'); // hide again
        }
      }
    },{
      threshold: 0,                 // fire as soon as it touches viewport
      rootMargin: '0px 0px -10% 0'  // slightly earlier as you approach bottom
    });
    io.observe(sentinel);
  }

  /* ---------------- Manifest-backed sections (travel/portfolio/album) ---- */
  const GH = { owner:'Hanley-Darlington', repo:'about', ref:'main' };
  const IMG_EXT=['.jpg','.jpeg','.png','.webp','.gif','.avif'];
  const VIDEO_EXT=['.mp4','.webm'];
  const hasExt=(n,exts)=>{ n=(n||'').toLowerCase(); for(let i=0;i<exts.length;i++) if(n.endsWith(exts[i])) return true; return false; };
  const isImg =(n)=>hasExt(n,IMG_EXT);
  const isVideo=(n)=>hasExt(n,VIDEO_EXT);
  const isMedia=(n)=>isImg(n)||isVideo(n);
  const rawURL=(p)=>'https://raw.githubusercontent.com/'+GH.owner+'/'+GH.repo+'/'+GH.ref+'/'+encodeURI(p)+'?v='+Date.now();
  const endsWithToken=(p,t)=>{ const b=(p||'').split('/').pop().toLowerCase(); const d=b.lastIndexOf('.'); const nm=d>=0?b.slice(0,d):b; return nm.endsWith(String(t).toLowerCase()); };
  const fetchJSON=(u)=>fetch(u,{headers:{'Accept':'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
  const buildManifestFromTree=(tree)=>{
    const f=tree && tree.tree ? tree.tree : []; const m={portfolio:[],travels:{},profile:[]};
    for(let i=0;i<f.length;i++){
      const it=f[i]; if(it.type!=='blob'||!isMedia(it.path)) continue;
      if(it.path.startsWith('portfolio/')) m.portfolio.push(it.path);
      else if(it.path.startsWith('travels/')){
        const parts=it.path.split('/'); if(parts.length>=3){ const folder=decodeURIComponent(parts[1]); (m.travels[folder]||(m.travels[folder]=[])).push(it.path); }
      } else if(it.path.startsWith('profile/')) m.profile.push(it.path);
    } return m;
  };
  const loadManifest=()=>fetch('/manifest.json',{cache:'no-store'})
    .then(r=>{if(r.ok)return r.json(); throw new Error('no manifest');})
    .catch(()=>fetchJSON('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/commits/'+encodeURIComponent(GH.ref))
      .then(c=>fetchJSON('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/git/trees/'+c.commit.tree.sha+'?recursive=1'))
      .then(buildManifestFromTree));
  const listPortfolio=(m)=>m.portfolio.map(p=>({src:rawURL(p),alt:p.split('/').pop(),type:isVideo(p)?'video':'image'}));
  const listTravelAll=(m)=>{ const out=[]; for(const f in m.travels){ m.travels[f].forEach(p=>out.push({src:rawURL(p),alt:p.split('/').pop(),folder:f,type:isVideo(p)?'video':'image'})); } return out; };
  const listAlbum=(m,folder)=>(m.travels[folder]||[]).map(p=>({src:rawURL(p),alt:p.split('/').pop(),type:isVideo(p)?'video':'image'}));
  const heroFromProfile=(m)=>{ const pics=m.profile.filter(isImg); const star=pics.find(p=>endsWithToken(p,'star')); return star?rawURL(star):(pics.length?rawURL(pics[0]):'/profile/profile-star.webp'); };

  function clear(el){ while(el.firstChild) el.removeChild(el.firstChild); }
  function makeVideo(src){ const v=document.createElement('video'); v.src=src; v.muted=true; v.loop=true; v.autoplay=true; v.playsInline=true; v.controls=false; return v; }

  // NO AOS anywhere outside home
  function mountGrid(id,files){
    const el=$(id); clear(el);
    if(!files.length){ const p=document.createElement('p'); p.textContent='Nothing yet.'; p.style.color='#9aa7bd'; el.appendChild(p); return; }
    for(let i=0;i<files.length;i++){
      const f=files[i];
      const fig=document.createElement('figure'); fig.className='shot';
      const node=f.type==='video'?makeVideo(f.src):Object.assign(new Image(),{src:f.src,alt:f.alt,loading:'lazy'});
      fig.appendChild(node); el.appendChild(fig);
    }
  }

  const views={home:$('view-home'),portfolio:$('view-portfolio'),travels:$('view-travels'),album:$('view-album')};
  const show=(v)=>{ for(const k in views) views[k].classList.add('hidden'); views[v].classList.remove('hidden'); scrollTo(0,0); };

  function routeWith(m){
    const h=(location.hash||'').slice(1);

    if(h.startsWith('/portfolio')){
      show('portfolio');
      mountGrid('portfolioGrid',listPortfolio(m));
      return;
    }

    if(h.startsWith('/travels')){
      show('travels');
      const grouped={};
      listTravelAll(m).forEach(f=>(grouped[f.folder]||(grouped[f.folder]=[])).push(f));
      const wrap=$('travelCards'); clear(wrap);
      for(const folder in grouped){
        const files=grouped[folder];
        const cover = files.find(f=>endsWithToken(f.alt,'star')) || files[0];
        const card=document.createElement('article'); card.className='place';
        card.appendChild(cover.type==='video'?makeVideo(cover.src):Object.assign(new Image(),{src:cover.src,alt:folder,loading:'lazy'}));
        const ov=document.createElement('div'); ov.className='overlay';
        ov.innerHTML='<h4>'+folder+'</h4><p>'+files.length+' files</p><a class="chip" href="#/travel/'+encodeURIComponent(folder)+'">View</a>';
        card.appendChild(ov);
        wrap.appendChild(card);
      }
      return;
    }

    if(h.startsWith('/travel/')){
      const folder=decodeURIComponent(h.split('/')[2]);
      show('album'); $('albumTitle').textContent=folder;
      mountGrid('albumGrid',listAlbum(m,folder));
      return;
    }

    // HOME
    show('home');
    mountHomepageGrid();
  }

  // Lightbox close
  const lightbox=$('lightbox');
  lightbox.addEventListener('click',e=>{ if(e.target===lightbox||e.target.classList.contains('close')) lightbox.classList.remove('open'); });

  // Boot
  function boot(){
    initAOSToggle();
    loadManifest().then(m=>{
      $('heroImg').src = heroFromProfile(m);  // fast hero, then swap if repo has a star
      routeWith(m);
      window.addEventListener('hashchange', ()=>routeWith(m));
    });
  }
  boot();
})();
</script>
</body>
</html>
