<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>William Darlington</title>

  <link rel="icon" href="/favicon/user.png" sizes="32x32" />
  <link rel="shortcut icon" href="/favicon/user.png" />
  <meta name="theme-color" content="#0b0e14" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#0b0e14;--muted:#94a3b8;--text:#e8eefc;--brand:#7c3aed;--brand-2:#22d3ee;--ring:rgba(124,58,237,.4);--shadow:0 14px 40px rgba(0,0,0,.5);--radius:20px;--home-spacer:400px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--text);line-height:1.55;background:
      radial-gradient(1200px 500px at 120% -10%, rgba(34,211,238,.08), transparent 60%),
      radial-gradient(1000px 500px at -20% 10%, rgba(124,58,237,.09), transparent 60%),var(--bg)}
    img,video{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    .container{width:min(1200px,92%);margin-inline:auto}

    header{position:sticky;top:0;z-index:9999;background:rgba(15,21,36,.78);backdrop-filter:saturate(150%) blur(12px);border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer;isolation:isolate}
    .nav{display:flex;justify-content:flex-end;align-items:center;padding:14px 28px;gap:12px}
    .nav-links{display:flex;gap:12px;flex-wrap:wrap}
    .chip{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
    .pill{padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-2));font-weight:700;color:#0a0a0a;box-shadow:0 8px 24px var(--ring)}
    @media (max-width:560px){.nav{justify-content:center;padding:10px 0}.nav-links{gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.nav-links::-webkit-scrollbar{display:none}.chip,.pill{padding:8px 12px;font-size:14px}.nav-links .chip,.nav-links .pill{padding:8px 10px;font-size:13px}}

    section{padding:24px 0 52px}
    .hero{display:grid;grid-template-columns:1fr;padding:64px 0;gap:32px;align-items:center}
    @media(max-width:900px){.hero{grid-template-columns:1fr;text-align:center}}
    .hero h1{font-size:clamp(32px,5vw,56px);font-weight:800;line-height:1.1;margin-bottom:10px}
    .hero p{color:var(--muted)}

    .hidden{display:none}
    .view-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
    .view-head h2{font-size:clamp(24px,3vw,34px)}
    .back{padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14)}

    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
    .shot{border-radius:var(--radius);overflow:hidden;background:#111;box-shadow:var(--shadow);cursor:zoom-in}
    #streamGrid .shot,#portfolioGrid .shot,#albumGrid .shot{aspect-ratio:16/9}
    #streamGrid .shot img,#streamGrid .shot video,#portfolioGrid .shot img,#portfolioGrid .shot video,#albumGrid .shot img,#albumGrid .shot video{width:100%;height:100%;object-fit:cover;background:#000}
    #albumGrid{align-items:start}

    .place{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:16/9;background:#000}
    .place img,.place video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
    .place .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,.08) 60%);display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
    .place h4{margin:0 0 6px;font-size:18px}
    .place p{margin:0 0 10px;font-size:14px;color:var(--muted)}
    .place a{align-self:start}

    .world{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
    .world-stage{position:relative;height:min(72vh,720px);min-height:380px;-webkit-user-select:none;user-select:none}
    #globe{position:absolute;inset:0}
    #globe canvas,#globe canvas+div{-webkit-mask-image:radial-gradient(closest-side,#000 86%,transparent);mask-image:radial-gradient(closest-side,#000 86%,transparent)}
    #globe canvas:not(.clickable){cursor:grab}
    #globe canvas:not(.clickable):active{cursor:grabbing}
    #globe .float-tooltip-kap{z-index:3;padding:8px 12px;border-radius:12px;font:500 13px/1.45 Inter,system-ui,sans-serif;color:var(--text);background:rgba(15,21,36,.94);border:1px solid rgba(255,255,255,.12);box-shadow:var(--shadow)}
    #globe:has(.g-pin:hover) .float-tooltip-kap{visibility:hidden}
    .world svg{vertical-align:-2px}
    .world-hint{position:absolute;inset:auto 0 6px;text-align:center;font-size:13px;color:var(--muted);pointer-events:none}
    .world-panel{display:grid;gap:16px}
    .world-card{padding:18px;border-radius:var(--radius);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
    .world-card p{color:var(--muted);font-size:14px}
    .world-count{font-size:34px;font-weight:800;line-height:1.1}
    .world-count small{font-size:14px;font-weight:600;color:var(--muted)}
    .world-bar{height:6px;margin:12px 0 14px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
    .world-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
    .world-list{display:flex;flex-wrap:wrap;gap:8px}
    .world-list .chip{font:inherit;font-size:14px;color:inherit;cursor:pointer}
    .world-list .chip.on{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:#0a0a0a;font-weight:700}
    .world-detail{display:grid;gap:12px}
    .world-detail h3{display:flex;align-items:center;gap:8px;font-size:20px}
    .g-pin{width:12px;height:12px;padding:0;border-radius:50%;border:2px solid #fff;background:var(--brand);cursor:pointer;pointer-events:auto;animation:gPulse 2.2s ease-out infinite}
    .g-pin span{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);padding:4px 9px;border-radius:999px;white-space:nowrap;font:600 12px Inter,system-ui,sans-serif;color:var(--text);background:rgba(15,21,36,.94);border:1px solid rgba(255,255,255,.14);opacity:0;pointer-events:none;transition:opacity .15s}
    .g-pin:hover span,.g-pin:focus-visible span{opacity:1}
    @keyframes gPulse{from{box-shadow:0 0 0 0 rgba(124,58,237,.75)}to{box-shadow:0 0 0 12px rgba(124,58,237,0)}}
    @media(max-width:900px){.world{grid-template-columns:1fr}.world-stage{height:min(92vw,70vh);min-height:0}}
    @media (prefers-reduced-motion:reduce){.g-pin{animation:none}}

    @media (hover:hover) and (pointer:fine){
      .shot{transition:transform .18s ease, box-shadow .18s ease;will-change:transform}
      .shot:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 20px 50px rgba(0,0,0,.6)}
      .shot:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
      #streamGrid{display:none} #streamGrid.is-on{display:grid}
      .home-spacer{display:block;height:var(--home-spacer)}
    }

    .lightbox{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);padding:20px}
    .lightbox.open{display:flex}
    .lightbox img,.lightbox video{max-width:min(1200px,95vw);max-height:90vh;border-radius:16px;box-shadow:var(--shadow);background:#000}
    .lightbox .close{position:absolute;top:14px;right:14px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;cursor:pointer}

    .anim-wrap{display:block;will-change:transform,opacity}
    .anim-play.zoom-in{animation:zin 1.2s ease-out both}
    .anim-play.zoom-in-up{animation:zinUp 1.2s ease-out both}
    .anim-play.zoom-in-down{animation:zinDown 1.2s ease-out both}
    .anim-play.zoom-in-left{animation:zinLeft 1.2s ease-out both}
    .anim-play.zoom-in-right{animation:zinRight 1.2s ease-out both}
    @keyframes zin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
    @keyframes zinUp{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
    @keyframes zinDown{from{opacity:0;transform:translateY(-24px) scale(.92)}to{opacity:1;transform:none}}
    @keyframes zinLeft{from{opacity:0;transform:translateX(-24px) scale(.92)}to{opacity:1;transform:none}}
    @keyframes zinRight{from{opacity:0;transform:translateX(24px) scale(.92)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.anim-play.zoom-in,.anim-play.zoom-in-up,.anim-play.zoom-in-down,.anim-play.zoom-in-left,.anim-play.zoom-in-right{animation:none}}

    @supports not (aspect-ratio:1/1){
      #streamGrid .shot,#portfolioGrid .shot,#albumGrid .shot,.place{position:relative}
      #streamGrid .shot::before,#portfolioGrid .shot::before,#albumGrid .shot::before,.place::before{content:"";display:block;padding-top:56.25%}
      #streamGrid .shot>img,#streamGrid .shot>video,#portfolioGrid .shot>img,#portfolioGrid .shot>video,#albumGrid .shot>img,#albumGrid .shot>video,.place>img,.place>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    }

    /* ---- Footer pinned & socials centered ---- */
    html, body { height: 100%; }
    body { min-height: 100dvh; display: flex; flex-direction: column; }
    main { flex: 1; }

    footer {
      margin-top: auto;
      padding: 28px 0 calc(28px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .footer-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .social {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
<header>
  <div class="nav container">
    <nav class="nav-links">
      <a class="chip" href="#/portfolio">Portfolio</a>
      <a class="chip" href="#/films">Films</a>
      <a class="chip" href="#/world">World</a>
      <a class="pill" href="https://hdbot.io" target="_blank" rel="noopener">ALGOs</a>
      <a class="chip" href="mailto:hanley.darlington@gmail.com">Contact</a>
    </nav>
  </div>
</header>

<script>
  (()=>{const h=document.querySelector('header'); if(!h) return;
    h.addEventListener('click',e=>{ if(!e.target.closest('a')) location.hash='#/'; },true);
  })();
</script>

<main>
  <section id="view-home">
    <div class="container">
      <div class="hero"><div><h1>William Darlington</h1><p>Vires in Numeris</p><p>All Visuals are Authentic</p></div></div>
      <div class="home-spacer" id="homeSpacer" aria-hidden="true"></div>
      <div class="gallery" id="streamGrid"></div>
    </div>
  </section>

  <section id="view-portfolio" class="hidden">
    <div class="container">
      <div class="view-head"><h2>Portfolio</h2><a class="back" href="#/">← Home</a></div>
      <div class="gallery" id="portfolioGrid"><p style="color:#9aa7bd">Loading…</p></div>
      <div id="portfolioError"></div>
    </div>
  </section>

  <section id="view-films" class="hidden">
    <div class="container">
      <div class="view-head"><h2>Films</h2><a class="back" href="#/">← Home</a></div>
      <div class="gallery" id="filmsGrid"><p style="color:#9aa7bd">Nothing yet.</p></div>
    </div>
  </section>

  <section id="view-world" class="hidden">
    <div class="container">
      <div class="view-head"><h2>World</h2><a class="back" href="#/">← Home</a></div>
      <div class="world">
        <div class="world-stage"><div id="globe"></div><p class="world-hint" id="worldHint">Loading…</p></div>
        <aside class="world-panel hidden" id="worldPanel">
          <div class="world-card world-detail" id="worldDetail"></div>
          <div class="world-card"><div class="world-count" id="worldCount"></div><div class="world-bar"><i id="worldBar"></i></div><div class="world-list" id="worldList"></div></div>
        </aside>
      </div>
    </div>

  <section id="view-album" class="hidden">
    <div class="container">
      <div class="view-head"><h2 id="albumTitle">Album</h2><a class="back" href="#/world">← World</a></div>
      <div class="gallery" id="albumGrid"><p style="color:#9aa7bd">Loading…</p></div>
      <div id="albumError"></div>
    </div>
  </section>
</main>

<footer>
  <div class="container footer-center">
    <div class="social">
      <a class="chip" href="https://www.linkedin.com/in/william-darlington-736475212/" target="_blank" rel="noopener">LinkedIn</a>
      <a class="chip" href="https://instagram.com/wi11.4m" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
</footer>

<div id="lightbox" class="lightbox" aria-modal="true" role="dialog">
  <button class="close" aria-label="Close">✕</button>
</div>

<script>
(()=>{'use strict';
  const GH={owner:'Hanley-Darlington',repo:'about',ref:'main'};
  const isDesktop=matchMedia('(hover:hover) and (pointer:fine)').matches;
  const $=id=>document.getElementById(id);
  const raw=p=>'https://raw.githubusercontent.com/'+GH.owner+'/'+GH.repo+'/'+GH.ref+'/'+encodeURI(p)+'?v='+Date.now();
  const wExt=p=>/\.webp$/i.test(p), mExt=p=>/\.mp4$/i.test(p);
  const imgNode=(src,alt='')=>Object.assign(new Image(),{src,alt,loading:'lazy'});
  const vidNode=src=>{const v=document.createElement('video'); Object.assign(v,{src,loop:true,autoplay:true,controls:false}); v.muted=true; v.setAttribute('muted',''); v.playsInline=true; v.setAttribute('playsinline',''); return v;};

  const fetchJSON=(u,h)=>fetch(u,h).then(r=>{if(!r.ok) throw Error('HTTP '+r.status); return r.json();});
  const buildManifest=t=>{
    const m={portfolio:[],travels:{}};
    (t.tree||[]).forEach(x=>{
      const p=x.path; if(x.type!=='blob'||!(wExt(p)||mExt(p))) return;
      if(p.startsWith('portfolio/')) m.portfolio.push(p);
      else if(p.startsWith('travels/')){const f=decodeURIComponent(p.split('/')[1]); (m.travels[f]||(m.travels[f]=[])).push(p);}
    });
    return m;
  };
  const loadManifest=()=>fetch('/manifest.json',{cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject())
    .catch(()=>fetchJSON('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/commits/'+encodeURIComponent(GH.ref),{headers:{Accept:'application/vnd.github+json'}})
      .then(c=>fetchJSON('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/git/trees/'+c.commit.tree.sha+'?recursive=1',{headers:{Accept:'application/vnd.github+json'}}))
      .then(buildManifest));

  const mapFile=p=>({src:raw(p),alt:p.split('/').pop(),type:mExt(p)?'video':'image'});
  const listPortfolio=m=>m.portfolio.map(mapFile);
  const listAlbum=(m,f)=>(m.travels[f]||[]).map(mapFile);

  // iPhone-safe homepage slot probe: WebP first, then MP4, each with timeout
  const probeHome=i=>new Promise(res=>{
    const webp='/homepage/'+i+'.webp', mp4='/homepage/'+i+'.mp4'; let done=false; const finish=v=>{ if(!done){done=true; res(v);} };
    const im=new Image(), t1=setTimeout(()=>{im.onload=im.onerror=null; tryVid();},1800);
    im.onload=()=>{clearTimeout(t1); finish({type:'image',src:webp,alt:'home-'+i});};
    im.onerror=()=>{clearTimeout(t1); tryVid();};
    im.src=webp;
    function tryVid(){ if(done) return; const v=document.createElement('video'); v.preload='metadata';
      v.muted=true; v.setAttribute('muted',''); v.playsInline=true; v.setAttribute('playsinline','');
      const t2=setTimeout(()=>{cleanup(); finish(null);},2000);
      const ok=()=>{clearTimeout(t2); cleanup(); finish({type:'video',src:mp4,alt:'home-'+i});};
      const fail=()=>{clearTimeout(t2); cleanup(); finish(null);};
      const cleanup=()=>{v.onloadedmetadata=v.onerror=null; v.removeAttribute('src'); try{v.load();}catch{}};
      v.onloadedmetadata=ok; v.onerror=fail; v.src=mp4;
    }
  });
  const homeFiles=()=>Promise.all([...Array(12)].map((_,i)=>probeHome(i+1))).then(a=>a.filter(Boolean));

  const lightbox=(()=>{const el=$('lightbox');
    const open=f=>{el.innerHTML='<button class="close" aria-label="Close">✕</button>'; el.appendChild(f.type==='video'?Object.assign(vidNode(f.src),{controls:true}):imgNode(f.src,f.alt||'')); el.classList.add('open');};
    const close=()=>el.classList.remove('open');
    el.addEventListener('click',e=>{if(e.target===el||e.target.classList.contains('close')) close();});
    addEventListener('keydown',e=>{if(e.key==='Escape') close();});
    return {open};
  })();

  const mountGrid=(el,files)=>{el.textContent=''; if(!files.length){const p=document.createElement('p'); p.textContent='Nothing yet.'; p.style.color='#9aa7bd'; el.appendChild(p); return;}
    files.forEach(f=>{const fig=document.createElement('figure'); fig.className='shot'; fig.tabIndex=0; fig.dataset.type=f.type; fig.dataset.src=f.src; fig.dataset.alt=f.alt||'';
      fig.appendChild(f.type==='video'?vidNode(f.src):imgNode(f.src,f.alt)); el.appendChild(fig);
    });
  };
  const mountHome=(el,files)=>{el.textContent=''; const anim=['zoom-in-right','zoom-in-down','zoom-in-down','zoom-in-left','zoom-in-right','zoom-in','zoom-in','zoom-in-left','zoom-in-right','zoom-in-up','zoom-in-up','zoom-in-left'];
    files.forEach((f,i)=>{const wrap=document.createElement('div'); wrap.className='anim-wrap '+anim[i%anim.length];
      const fig=document.createElement('figure'); fig.className='shot'; fig.tabIndex=0; fig.dataset.type=f.type; fig.dataset.src=f.src; fig.dataset.alt=f.alt||'';
      fig.appendChild(f.type==='video'?vidNode(f.src):imgNode(f.src,f.alt)); wrap.appendChild(fig); el.appendChild(wrap);
    });
  };

  const bindLightbox=el=>{
    if(el.__lb) return; el.__lb=true;
    el.addEventListener('click',e=>{const fig=e.target.closest('figure.shot'); if(fig&&el.contains(fig)) lightbox.open({type:fig.dataset.type||'image',src:fig.dataset.src,alt:fig.dataset.alt||''});});
    el.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ') return; const fig=e.target.closest('figure.shot'); if(fig&&el.contains(fig)){e.preventDefault(); lightbox.open({type:fig.dataset.type||'image',src:fig.dataset.src,alt:fig.dataset.alt||''});}});
  };

  const placeCard=(folder,files,title=folder)=>{const a=document.createElement('article'); a.className='place'; const lead=files[0];
    a.appendChild(lead.type==='video'?vidNode(lead.src):imgNode(lead.src,title));
    const ov=document.createElement('div'); ov.className='overlay'; ov.innerHTML='<h4>'+title+'</h4><p>'+files.length+' files</p><a class="chip" href="#/travel/'+encodeURIComponent(folder)+'">View</a>';
    a.appendChild(ov); return a;
  };

  // World: 3D globe, loaded on first visit. A country is unlocked once a travel folder maps to it.
  const world=(()=>{
    const CDN='https://cdn.jsdelivr.net/npm/', TOTAL=195, still=matchMedia('(prefers-reduced-motion:reduce)').matches;
    // travel folder (lower-case) -> [country as named in the atlas, pin lat, pin lng, display name]
    // A folder named exactly after a country needs no entry here. Any other folder is listed, but stays off the globe.
    const PLACES={
      australia:['Australia',-25.3,133.8],
      bali:['Indonesia',-8.4,115.2],
      bordeaux:['France',44.84,-0.58],
      dordogne:['France',45.1,0.75],
      england:['United Kingdom',51.51,-0.12],
      galapagos:['Ecuador',-0.6,-90.5],
      greece:['Greece',38.3,23.3],
      hawaii:['United States of America',20.8,-156.9,'Hawaii'],
      isle:['United Kingdom',50.69,-1.3,'Isle of Wight'],
      italy:['Italy',41.9,12.5],
      'new zealand':['New Zealand',-41.3,173.5],
      scotland:['United Kingdom',56.8,-4.2],
      singapore:['Singapore',1.35,103.82],
      spain:['Spain',40.2,-3.7],
      switzerland:['Switzerland',46.8,8.2]
    };
    const LOCK='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
    const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
    const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(Error('Failed to load '+src)); document.head.appendChild(s);});
    const avg=(arr,k)=>arr.reduce((s,a)=>s+a[k],0)/arr.length;
    const centre=f=>{const c=f.geometry.coordinates, ring=(f.geometry.type==='Polygon'?[c]:c).map(p=>p[0]).sort((a,b)=>b.length-a.length)[0].map(([lng,lat])=>({lat,lng})); return [avg(ring,'lat'),avg(ring,'lng')];};

    let g=null, boot=null, on=false, sel=null, hover=null, hold=false, timer=0; const unlocked={};
    const isOpen=f=>!!unlocked[f.properties.name];
    const spin=()=>{if(g) g.controls().autoRotate=!still&&!hold&&!unlocked[sel];};
    const fit=()=>{const el=$('globe'); if(g&&el.clientWidth) g.width(el.clientWidth).height(el.clientHeight);};
    const paint=()=>g
      .polygonAltitude(f=>isOpen(f)?(f===hover||f.properties.name===sel?.05:.02):.006)
      .polygonCapColor(f=>isOpen(f)?(f.properties.name===sel?'#a78bfa':f===hover?'#67e8f9':'rgba(34,211,238,.8)'):(f===hover?'rgba(148,163,184,.32)':'rgba(148,163,184,.13)'));

    const select=name=>{
      sel=name||null; const as=unlocked[sel], d=$('worldDetail'); d.textContent='';
      [...$('worldList').children].forEach(b=>b.classList.toggle('on',b.textContent===sel));
      if(!sel) d.innerHTML='<p>Glowing countries are unlocked. Click one to see its photos.</p>';
      else if(!as) d.innerHTML='<h3>'+LOCK+esc(sel)+'</h3><p>Locked. No photos from here yet.</p>';
      else{
        const h=document.createElement('h3'); h.textContent=sel; d.appendChild(h);
        as.forEach(a=>d.appendChild(placeCard(a.folder,a.files,a.title)));
        if(g&&as[0].placed) g.pointOfView({lat:avg(as,'lat'),lng:avg(as,'lng'),altitude:1.25},900);
        if(matchMedia('(max-width:900px)').matches) d.scrollIntoView({behavior:'smooth',block:'nearest'});
      }
      if(g) paint(); spin();
    };

    const pin=a=>{const b=document.createElement('button'); b.type='button'; b.className='g-pin'; b.setAttribute('aria-label',a.title);
      b.innerHTML='<span>'+esc(a.title)+' · '+a.files.length+' files</span>'; b.onclick=()=>{location.hash='#/travel/'+encodeURIComponent(a.folder);}; return b;};

    const init=async m=>{
      const [topo]=await Promise.all([fetchJSON(CDN+'world-atlas@2.0.2/countries-110m.json'),loadScript(CDN+'topojson-client@3.1.0/dist/topojson-client.min.js'),loadScript(CDN+'globe.gl@2.46.2/dist/globe.gl.min.js')]);
      const feats=topojson.feature(topo,topo.objects.countries).features.filter(f=>f.properties.name!=='Antarctica');
      const byName=Object.fromEntries(feats.map(f=>[f.properties.name.toLowerCase(),f]));
      const albums=Object.entries(m.travels).map(([folder,paths])=>{const k=folder.toLowerCase(), f=byName[k], p=PLACES[k]||(f?[f.properties.name,...centre(f)]:[folder]);
        return {folder,country:p[0],lat:p[1],lng:p[2],title:p[3]||folder,placed:p.length>1,files:paths.map(mapFile)};});
      albums.forEach(a=>(unlocked[a.country]||(unlocked[a.country]=[])).push(a));

      const names=Object.keys(unlocked).sort(), count=names.filter(n=>unlocked[n][0].placed).length;
      $('worldCount').innerHTML=count+' <small>of '+TOTAL+' countries unlocked</small>';
      $('worldBar').style.width=(count/TOTAL*100)+'%';
      names.forEach(n=>{const b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=n; b.onclick=()=>select(n===sel?null:n); $('worldList').appendChild(b);});
      $('worldPanel').classList.remove('hidden'); select(null);

      try{
        g=new Globe($('globe'))
          .backgroundColor('rgba(0,0,0,0)').atmosphereColor('#22d3ee').atmosphereAltitude(.17).showGraticules(true)
          .polygonsData(feats).polygonsTransitionDuration(250)
          .polygonSideColor(f=>isOpen(f)?'rgba(34,211,238,.28)':'rgba(0,0,0,0)')
          .polygonStrokeColor(f=>isOpen(f)?'#cffafe':'rgba(148,163,184,.3)')
          .polygonLabel(f=>{const n=f.properties.name, as=unlocked[n]; return '<b>'+esc(n)+'</b><br>'+(as?as.length+(as.length>1?' albums':' album')+' · click to open':LOCK+' Locked');})
          .onPolygonHover(f=>{hover=f; paint();})
          .onPolygonClick(f=>select(f.properties.name))
          .onGlobeClick(()=>select(null))
          .showPointerCursor((type,d)=>type==='polygon'&&isOpen(d))
          .htmlElementsData(albums.filter(a=>a.placed)).htmlElement(pin).htmlAltitude(.03)
          .pointOfView({lat:28,lng:8,altitude:1.9});
      }catch(e){$('worldHint').textContent='3D is not available in this browser. Use the list instead.'; return;}
      const mat=g.globeMaterial(); mat.color.set('#0c1526'); mat.emissive.set('#0a1730'); mat.shininess=6;
      const c=g.controls(); c.autoRotateSpeed=.55; c.enablePan=false; c.minDistance=140; c.maxDistance=430;
      paint(); spin(); fit(); new ResizeObserver(fit).observe($('globe'));
      const stage=$('globe').parentNode;
      stage.addEventListener('pointerenter',()=>{clearTimeout(timer); hold=true; spin();});
      stage.addEventListener('pointerleave',()=>{timer=setTimeout(()=>{hold=false; spin();},1200);});
      $('worldHint').textContent=isDesktop?'Drag to spin · scroll to zoom':'Drag to spin · pinch to zoom';
    };

    const open=m=>{on=true; (boot||(boot=init(m))).then(()=>{if(!g) return; if(on){fit(); g.resumeAnimation();} else g.pauseAnimation();})
      .catch(()=>{boot=null; $('worldHint').textContent='Could not load the globe. Check your connection and try again.';});};
    const close=()=>{on=false; if(g) g.pauseAnimation();};
    return {open,close};
  })();

  const views={home:$('view-home'),portfolio:$('view-portfolio'),films:$('view-films'),world:$('view-world'),album:$('view-album')};
  const show=v=>{Object.values(views).forEach(x=>x.classList.add('hidden')); views[v].classList.remove('hidden'); scrollTo(0,0);};

  let homeScrollHandler=null, animOn=false; const ROW=250, COL=100;
  const atBottom=()=>innerHeight+scrollY>=document.documentElement.scrollHeight-120;
  const enableHome=g=>{if(animOn) return; $('homeSpacer').style.display='none'; g.classList.add('is-on'); g.querySelectorAll('.anim-wrap').forEach((w,i)=>{w.classList.remove('anim-play'); void w.offsetWidth; w.style.animationDelay=(~~(i/4)*ROW+(i%4)*COL)+'ms'; w.classList.add('anim-play');}); animOn=true;};
  const disableHome=g=>{const s=$('homeSpacer'); if(s) s.style.display=''; g.classList.remove('is-on'); if(!animOn) return; g.querySelectorAll('.anim-wrap').forEach(w=>{w.classList.remove('anim-play'); w.style.animationDelay='';}); animOn=false;};
  const installHomeToggle=g=>{if(!isDesktop){$('homeSpacer').style.display='none'; g.classList.add('is-on'); return;}
    disableHome(g); const onScroll=()=>atBottom()?enableHome(g):disableHome(g);
    homeScrollHandler=onScroll; addEventListener('scroll',onScroll,{passive:true}); onScroll();
  };
  const uninstallHomeToggle=g=>{if(homeScrollHandler){removeEventListener('scroll',homeScrollHandler); homeScrollHandler=null;} $('homeSpacer').style.display='none'; if(g){g.classList.add('is-on'); g.querySelectorAll('.anim-wrap').forEach(w=>w.classList.remove('anim-play'));} animOn=false;};

  const route=(m)=>{
    const h=(location.hash||'').slice(1); world.close();
    if(h.startsWith('/portfolio')){uninstallHomeToggle(); show('portfolio'); mountGrid($('portfolioGrid'),listPortfolio(m)); bindLightbox($('portfolioGrid')); return;}
    if(h.startsWith('/travels')){location.replace('#/world'); return;}
    if(h.startsWith('/films')){uninstallHomeToggle(); show('films'); return;}
    if(h.startsWith('/world')){uninstallHomeToggle(); show('world'); world.open(m); return;}
    if(h.startsWith('/travel/')){uninstallHomeToggle(); const folder=decodeURIComponent(h.split('/')[2]); show('album'); $('albumTitle').textContent=folder; mountGrid($('albumGrid'),listAlbum(m,folder)); bindLightbox($('albumGrid')); return;}
    // HOME
    show('home'); uninstallHomeToggle();
    homeFiles().then(files=>{const grid=$('streamGrid'); mountHome(grid,files); bindLightbox(grid); installHomeToggle(grid);});
  };

  loadManifest().then(m=>{
    route(m);
    addEventListener('hashchange',()=>route(m));
  });
})();
</script>
</body>
</html>
