<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>William Darlington</title>

  <link rel="icon" href="/favicon/user.png" sizes="32x32" />
  <link rel="shortcut icon" href="/favicon/user.png" />
  <meta name="theme-color" content="#0b0e14" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0e14; --muted:#94a3b8; --text:#e8eefc;
      --brand:#7c3aed; --brand-2:#22d3ee; --ring:rgba(124,58,237,.4);
      --shadow:0 14px 40px rgba(0,0,0,.5); --radius:20px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:var(--text); line-height:1.55;
      background:
        radial-gradient(1200px 500px at 120% -10%, rgba(34,211,238,.08), transparent 60%),
        radial-gradient(1000px 500px at -20% 10%, rgba(124,58,237,.09), transparent 60%),
        var(--bg);
    }
    img,video{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    .container{width:min(1200px,92%);margin-inline:auto}

    /* Header (clickable to Home) */
    header{
      position:sticky;
      top:0;
      z-index:9999;
      background:rgba(15,21,36,.78);
      backdrop-filter:saturate(150%) blur(12px);
      border-bottom:1px solid rgba(255,255,255,.08);
      cursor:pointer;
      isolation:isolate; /* prevent overlaps blocking it */
    }

    .nav{display:flex;justify-content:flex-end;align-items:center;padding:14px 28px;gap:12px}
    .nav-links{display:flex;gap:12px;flex-wrap:wrap}
    .chip{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
    .pill{padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-2));font-weight:700;color:#0a0a0a;box-shadow:0 8px 24px var(--ring)}

    @media (max-width:560px){
      .nav{justify-content:center;padding:10px 14px}
      .nav-links{gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
      .nav-links::-webkit-scrollbar{display:none}
      .chip,.pill{padding:8px 12px;font-size:14px}
    }

    section{padding:24px 0 52px}
    .hero{display:grid;grid-template-columns:1fr 1fr;padding:64px 0;gap:32px;align-items:center}
    @media(max-width:900px){.hero{grid-template-columns:1fr;text-align:center}}
    .hero h1{font-size:clamp(32px,5vw,56px);font-weight:800;line-height:1.1;margin-bottom:10px}
    .hero p{color:var(--muted)}
    .hero-card{border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;justify-self:end;max-width:min(520px,90vw)}
    @media(max-width:900px){.hero-card{justify-self:center}}
    .hero-card img{width:100%;height:auto;object-fit:cover}

    .hidden{display:none}
    .view-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
    .view-head h2{font-size:clamp(24px,3vw,34px)}
    .back{padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14)}

    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
    .shot{border-radius:var(--radius);overflow:hidden;background:#111;box-shadow:var(--shadow);cursor:pointer}

    #streamGrid .shot, #portfolioGrid .shot { aspect-ratio:16/9; }
    #streamGrid .shot img, #streamGrid .shot video,
    #portfolioGrid .shot img, #portfolioGrid .shot video{
      width:100%;height:100%;object-fit:cover;background:#000;
    }
    #albumGrid { align-items: start; }
    #albumGrid .shot { aspect-ratio:16/9; }
    #albumGrid .shot img, #albumGrid .shot video{
      width:100%;height:100%;object-fit:cover;background:#000;
    }

    .travel-grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
    .place{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:16/9;background:#000}
    .place img,.place video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
    .place .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,.08) 60%);display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
    .place h4{margin:0 0 6px;font-size:18px}
    .place p{margin:0 0 10px;font-size:14px;color:var(--muted)}
    .place a{align-self:start}

    footer{padding:28px 0;border-top:1px solid rgba(255,255,255,.08)}
    .footer-center{display:flex;flex-direction:column;align-items:center;gap:10px}
    .social{display:flex;gap:10px}

    @media (hover:hover) and (pointer:fine){
      .shot{transition: transform .18s ease, box-shadow .18s ease;will-change: transform;}
      .shot:hover{transform: translateY(-4px) scale(1.02);box-shadow: 0 20px 50px rgba(0,0,0,.6);}
      .shot:focus-visible{outline: 2px solid var(--brand);outline-offset: 2px;}
    }

    .lightbox{position: fixed; inset: 0; z-index: 100;display: none; align-items: center; justify-content: center;background: rgba(0,0,0,.82); padding: 20px;}
    .lightbox.open{ display: flex; }
    .lightbox img, .lightbox video{max-width: min(1200px, 95vw);max-height: 90vh;border-radius: 16px;box-shadow: var(--shadow);background:#000;}
    .lightbox .close{position: absolute; top: 14px; right: 14px;padding: 8px 12px; border-radius: 999px;background: rgba(255,255,255,.12);border: 1px solid rgba(255,255,255,.18);color: #fff; cursor: pointer;}
  </style>
</head>
<body>
<header>
  <div class="nav container">
    <nav class="nav-links">
      <a class="chip" href="#/portfolio">Portfolio</a>
      <a class="chip" href="#/travels">Travel</a>
      <a class="pill" href="https://hdbot.io" target="_blank" rel="noopener">ALGOs</a>
      <a class="chip" href="mailto:hanley.darlington@gmail.com">Contact</a>
    </nav>
  </div>
</header>

<script>
  // Make header clickable for Home
  (function(){
    var hdr = document.querySelector('header');
    if(!hdr) return;
    hdr.addEventListener('click', function(e){
      if(e.target.closest('a')) return; // don’t block links
      location.hash = '#/';
    }, true);
  })();
</script>

<main>
  <section id="view-home">
    <div class="container">
      <div class="hero">
        <div><h1>William Darlington</h1><p>Vires in Numeris</p></div>
        <div class="hero-card"><img id="heroImg" src="user.png" alt="Profile"></div>
      </div>
      <div class="gallery stream-grid" id="streamGrid"><p style="color:#9aa7bd">Loading photos…</p></div>
    </div>
  </section>

  <section id="view-portfolio" class="hidden">
    <div class="container">
      <div class="view-head"><h2>Portfolio</h2><a class="back" href="#/">← Home</a></div>
      <div class="gallery" id="portfolioGrid"><p style="color:#9aa7bd">Loading…</p></div>
      <div id="portfolioError"></div>
    </div>
  </section>

  <section id="view-travels" class="hidden">
    <div class="container">
      <div class="view-head"><h2>Travel</h2><a class="back" href="#/">← Home</a></div>
      <div class="travel-grid" id="travelCards"><p style="color:#9aa7bd">Loading…</p></div>
      <div id="travelsError"></div>
    </div>
  </section>

  <section id="view-album" class="hidden">
    <div class="container">
      <div class="view-head"><h2 id="albumTitle">Album</h2><a class="back" href="#/travels">← All trips</a></div>
      <div class="gallery" id="albumGrid"><p style="color:#9aa7bd">Loading…</p></div>
      <div id="albumError"></div>
    </div>
  </section>
</main>

<footer>
  <div class="container footer-center">
    <div class="social">
      <a class="chip" href="https://www.linkedin.com/in/william-darlington-736475212/" target="_blank" rel="noopener">LinkedIn</a>
      <a class="chip" href="https://instagram.com/wi11.4m" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
</footer>

<div id="lightbox" class="lightbox" aria-modal="true" role="dialog">
  <button class="close" aria-label="Close">✕</button>
</div>

<script>
(function(){
  'use strict';

  var GH = { owner:'Hanley-Darlington', repo:'about', ref:'main' };
  var IMG_EXT=['.jpg','.jpeg','.png','.webp','.gif','.avif'];
  var VIDEO_EXT=['.mp4','.webm'];

  function rawURL(path){ return 'https://raw.githubusercontent.com/'+GH.owner+'/'+GH.repo+'/'+GH.ref+'/'+encodeURI(path)+'?v='+Date.now(); }
  function hasExt(n,exts){n=(n||'').toLowerCase();for(var i=0;i<exts.length;i++){if(n.endsWith(exts[i]))return true;}return false;}
  function isImg(n){return hasExt(n,IMG_EXT);} function isVideo(n){return hasExt(n,VIDEO_EXT);} function isMedia(n){return isImg(n)||isVideo(n);}
  function cacheGet(){return null;} function cacheSet(){}

  function fetchJSON(url){return fetch(url,{headers:{'Accept':'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}

  function buildManifestFromTree(tree){var f=tree&&tree.tree?tree.tree:[];var m={portfolio:[],travels:{},profile:[]};for(var i=0;i<f.length;i++){var it=f[i];if(it.type!=='blob'||!isMedia(it.path))continue;if(it.path.startsWith('portfolio/'))m.portfolio.push(it.path);else if(it.path.startsWith('travels/')){var parts=it.path.split('/');if(parts.length>=3){var folder=decodeURIComponent(parts[1]);(m.travels[folder]||(m.travels[folder]=[])).push(it.path);}}else if(it.path.startsWith('profile/'))m.profile.push(it.path);}return m;}
  function loadManifest(){return fetch('/manifest.json',{cache:'no-store'}).then(r=>{if(r.ok)return r.json();throw new Error('no manifest');}).catch(()=>fetchJSON('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/commits/'+encodeURIComponent(GH.ref)).then(c=>fetchJSON('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/git/trees/'+c.commit.tree.sha+'?recursive=1')).then(buildManifestFromTree));}

  function listPortfolio(m){return m.portfolio.map(p=>({src:rawURL(p),alt:p.split('/').pop(),type:isVideo(p)?'video':'image'}));}
  function listTravelAll(m){var out=[];for(var f in m.travels){m.travels[f].forEach(p=>out.push({src:rawURL(p),alt:p.split('/').pop(),folder:f,type:isVideo(p)?'video':'image'}));}return out;}
  function listAlbum(m,folder){return (m.travels[folder]||[]).map(p=>({src:rawURL(p),alt:p.split('/').pop(),type:isVideo(p)?'video':'image'}));}
  function heroFromProfile(m){var pics=m.profile.filter(isImg);return pics.length?rawURL(pics[0]):'user.png';}

  function byId(id){return document.getElementById(id);} function clear(el){while(el.firstChild)el.removeChild(el.firstChild);}
  function makeVideo(src){var v=document.createElement('video');v.src=src;v.muted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.controls=false;return v;}

  function mountGrid(id,files,onClick){var el=byId(id);clear(el);if(!files.length){var p=document.createElement('p');p.textContent='Nothing yet.';p.style.color='#9aa7bd';el.appendChild(p);return;}files.forEach(f=>{var fig=document.createElement('figure');fig.className='shot';var node=f.type==='video'?makeVideo(f.src):(Object.assign(new Image(),{src:f.src,alt:f.alt,loading:'lazy'}));if(onClick)fig.addEventListener('click',()=>onClick(f));fig.appendChild(node);el.appendChild(fig);});}

  // lightbox
  var lightboxEl;function setupLightbox(){lightboxEl=byId('lightbox');lightboxEl.addEventListener('click',e=>{if(e.target===lightboxEl||e.target.classList.contains('close'))closeLightbox();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});}
  function openLightbox(f){lightboxEl.innerHTML='<button class="close">✕</button>';if(f.type==='video'){var v=makeVideo(f.src);v.controls=true;lightboxEl.appendChild(v);}else{var img=new Image();img.src=f.src;img.alt=f.alt;lightboxEl.appendChild(img);}lightboxEl.classList.add('open');}
  function closeLightbox(){lightboxEl.classList.remove('open');}

  var views={home:byId('view-home'),portfolio:byId('view-portfolio'),travels:byId('view-travels'),album:byId('view-album')};
  function show(v){Object.values(views).forEach(x=>x.classList.add('hidden'));views[v].classList.remove('hidden');scrollTo(0,0);}

  function routeWith(m){var h=(location.hash||'').slice(1);
    if(h.startsWith('/portfolio')){show('portfolio');mountGrid('portfolioGrid',listPortfolio(m),openLightbox);return;}
    if(h.startsWith('/travels')){show('travels');var g={};listTravelAll(m).forEach(f=>(g[f.folder]||(g[f.folder]=[])).push(f));var wrap=byId('travelCards');clear(wrap);for(var folder in g){var files=g[folder];var card=document.createElement('article');card.className='place';card.appendChild(files[0].type==='video'?makeVideo(files[0].src):Object.assign(new Image(),{src:files[0].src,alt:folder}));var ov=document.createElement('div');ov.className='overlay';ov.innerHTML='<h4>'+folder+'</h4><p>'+files.length+' files</p><a class="chip" href="#/travel/'+encodeURIComponent(folder)+'">View</a>';card.appendChild(ov);wrap.appendChild(card);}return;}
    if(h.startsWith('/travel/')){var folder=decodeURIComponent(h.split('/')[2]);show('album');byId('albumTitle').textContent=folder;mountGrid('albumGrid',listAlbum(m,folder),openLightbox);return;}
    show('home');var all=[...listPortfolio(m),...listTravelAll(m)];mountGrid('streamGrid',all.slice(0,12),f=>{if(f.folder)location.hash='#/travel/'+encodeURIComponent(f.folder);else location.hash='#/portfolio';});
  }

  function boot(){setupLightbox();loadManifest().then(m=>{byId('heroImg').src=heroFromProfile(m);routeWith(m);window.addEventListener('hashchange',()=>routeWith(m));});}
  boot();
})();
</script>
</body>
</html>
